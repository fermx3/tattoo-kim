name: CI

on:
  push:
    branches: [master]
  pull_request:

# Los umbrales de Lighthouse arrancan en modo "warn" (ver lighthouserc.json).
# Una vez confirmado que el runner alcanza >= 90 de forma estable, subirlos a "error".
env:
  GOOGLE_PLACES_API_KEY: ${{ secrets.GOOGLE_PLACES_API_KEY }}
  GOOGLE_PLACE_ID_PDC: ${{ secrets.GOOGLE_PLACE_ID_PDC }}
  GOOGLE_PLACE_ID_CUN: ${{ secrets.GOOGLE_PLACE_ID_CUN }}

jobs:
  quality:
    name: Lint, typecheck y build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: ESLint
        run: npm run lint

      - name: TypeScript
        run: npm run typecheck

      - name: Build (incluye validate-frontmatter)
        run: npm run build

  lighthouse:
    name: Lighthouse CI
    needs: quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - run: npm run build

      - name: Lighthouse CI
        uses: treosh/lighthouse-ci-action@v12
        with:
          configPath: ./lighthouserc.json
          uploadArtifacts: true
          artifactName: lighthouse-results
